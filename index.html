<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>口袋影之诗 · 卡组编辑器</title>
<meta name="description" content="口袋影之诗（Shadowverse: Evolve）网页版卡组编辑器，支持官方卡组码导入导出">
<!-- 移动端：状态栏配色与「添加到主屏幕」后以独立窗口运行 -->
<meta name="theme-color" content="#0e1218">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SVE 组卡">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="style.css?v=60">
<link rel="stylesheet" href="style-mobile.css?v=60">
</head>
<body>

<!-- ================= 首页 ================= -->
<div id="viewHome" class="view home">
  <div class="home-card">
    <div class="home-logo">口袋影之诗</div>
    <h1>卡组编辑器</h1>
    <button id="btnStart" class="primary big">开始组卡</button>
    <button id="btnResume" class="big-ghost">继续组卡</button>
    <button id="btnMyDecks" class="big-ghost">我的卡组</button>
    <button id="btnImport" class="big-ghost">导入卡组码</button>
    <div class="home-tip">
      已有卡组 <b id="homeDeckCount">0</b> 套
      <span id="homeDeckInfo"></span>
    </div>
  </div>
</div>

<!-- ================= 组卡界面 ================= -->
<div id="viewEditor" class="view hidden">
  <header>
    <button id="btnBackHome" title="返回首页">←</button>
    <div class="brand">SVE 卡组编辑器</div>
    <button id="btnClearTop" class="danger" title="清空当前卡组（命名与保存在「查看卡组」里）">清空卡组</button>
  </header>

  <main id="main">
    <section class="pool">
      <div class="pool-head">
        <div class="tabs">
          <button class="tab active" data-side="basic">基础卡组</button>
          <button class="tab" data-side="evo">进化卡组</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <!-- ============ 左下角：筛选悬浮球 + 覆盖式抽屉 ============ -->
  <button id="btnFilterBall" class="fab fab-left" title="筛选" aria-label="筛选">
    <span class="fab-ico">⚙</span>
  </button>

  <aside class="filters" id="filtersPanel">
    <div class="filters-head">
      <span>筛选</span>
      <button id="btnFiltersClose" class="collapse-btn" title="收起筛选">×</button>
    </div>

    <!-- 关键词放在最上面，不加小标题 -->
    <input id="fText" class="filter-text" placeholder="卡名/卡号">

    <!-- 常驻：费用 + 类型 -->
    <label>费用
      <div id="fCost" class="chips"></div>
    </label>
    <label>类型
      <div id="fType" class="chips"></div>
    </label>

    <!-- 抽屉：职业（职业卡池=所选职业+中立 互斥；主题卡池=七职业多选） -->
    <details class="drawer">
      <summary>职业 <b id="fClsCount"></b></summary>
      <div id="fCls" class="pick-list"></div>
    </details>

    <!-- 抽屉：稀有度 -->
    <details class="drawer">
      <summary>稀有度</summary>
      <div id="fRare" class="chips"></div>
    </details>

    <!-- 抽屉：卡盒（PR 单独一盒，一行一个，行末打勾） -->
    <details class="drawer">
      <summary>卡盒 <b id="fBoxCount"></b></summary>
      <div id="fBox" class="pick-list"></div>
    </details>

    <!-- 抽屉：兵种（带关键词搜索） -->
    <details class="drawer">
      <summary>兵种 <b id="fTroopCount"></b></summary>
      <input id="fTroopSearch" class="drawer-search" placeholder="搜索兵种">
      <div id="fTroop" class="pick-list"></div>
    </details>

    <div class="clear-filters"><button id="btnClearFilter">清空筛选</button></div>
  </aside>

  <!-- ============ 右下角：卡组悬浮球 ============ -->
  <button id="btnDeckBall" class="fab fab-right" title="查看卡组（基础/进化）" aria-label="查看卡组">
    <span class="fab-count"><b id="fabBasic">0</b><em>/</em><b id="fabEvo">0</b></span>
  </button>
</div>

<!-- ================= 向导 ================= -->
<div id="wizard" class="modal hidden">
  <div class="modal-box wizard-box">

    <!-- 职业 / 联动主题（照官方按钮样式） -->
    <div class="step-title">选择牌组职业</div>
    <div id="poolList" class="pool-grid"></div>

    <!-- 主战者：与职业同层，选完职业后即时刷新 -->
    <div class="step-title">选择主战者 <span id="wizPoolTag"></span></div>
    <div id="masterList" class="master-list"></div>

    <div class="modal-actions">
      <button id="wizCancel">返回</button>
      <button id="wizOk" class="primary" disabled>进入组卡</button>
    </div>
  </div>
</div>

<!-- ================= 卡组码 ================= -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">卡组码</h3>
    <p id="modalDesc" class="modal-desc"></p>
    <textarea id="modalText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <button id="modalCopy">复制</button>
      <button id="modalOk" class="primary">确定</button>
    </div>
  </div>
</div>

<!-- ================= 查看卡组 ================= -->
<div id="preview" class="modal hidden">
  <div class="modal-box preview-box">

    <!-- 顶部：卡组信息 -->
    <div class="preview-top">
      <div class="preview-head">
        <h3 id="pvName">卡组</h3>
        <button id="pvClose" class="collapse-btn" title="关闭">×</button>
      </div>
      <!-- 三栏：主战者卡图 | 卡牌构成 | 费用曲线 -->
      <div class="preview-summary">
        <div class="pv-master">
          <img id="pvMasterImg" alt="" loading="lazy">
        </div>

        <div class="pv-stats">
          <div class="pv-row"><span>职业</span><b id="pvCls">—</b></div>
          <div class="pv-row"><span>随从</span><b id="pvFollower">0</b></div>
          <div class="pv-row"><span>法术</span><b id="pvSpell">0</b></div>
          <div class="pv-row"><span>护符</span><b id="pvAmulet">0</b></div>
          <div class="pv-row"><span>进化</span><b id="pvEvoCnt">0</b></div>
        </div>

        <div class="pv-curvebox">
          <div class="pv-total"><span>基础</span> <b id="pvCountBasic">0</b> <span>进化</span> <b id="pvCountEvo">0</b></div>
          <div id="pvCurveChart" class="curve-chart"></div>
        </div>
      </div>
    </div>

    <!-- 中间：次级框（可上下滚动），平铺卡组缩略图，上基础 / 下进化 -->
    <div class="preview-body">
      <div class="pv-sec">基础卡组 <span id="pvBasicN">0</span></div>
      <div id="pvBasic" class="preview-cards"></div>
      <div class="pv-sec">进化卡组 <span id="pvEvoN">0</span></div>
      <div id="pvEvo" class="preview-cards"></div>
    </div>

    <!-- 底部：左清空 · 右导出 -->
    <div class="preview-foot">
      <button id="pvClear" class="danger">清空卡组</button>
      <div class="pf-right">
        <button id="pvSave">保存卡组</button>
        <button id="pvImage">查看图片</button>
        <button id="pvExport" class="primary">生成卡组码</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= 卡组图片 ================= -->
<div id="deckImage" class="modal hidden">
  <div class="modal-box deckimg-box">
    <div class="preview-head">
      <h3 id="diTitle">卡组图片</h3>
      <button id="diClose" class="collapse-btn" title="关闭">×</button>
    </div>
    <div id="diBody" class="deckimg-body"></div>
    <div class="preview-foot">
      <button id="diSaveImg" class="primary">保存图片</button>
    </div>
  </div>
</div>

<!-- ================= 我的卡组 ================= -->
<div id="myDecks" class="modal hidden">
  <div class="modal-box mysaved-box">
    <div class="preview-head">
      <h3>我的卡组</h3>
      <button id="myClose" class="collapse-btn" title="关闭">×</button>
    </div>
    <div id="myList" class="mysaved-list"></div>
    <div class="preview-foot">
      <div class="pf-left">
        <button id="myExport" title="把全部卡组导出为 JSON 文件备份">导出备份</button>
        <button id="myImport" title="从 JSON 备份文件导入（合并，不覆盖）">导入备份</button>
      </div>
      <button id="myClose2">关闭</button>
    </div>
    <input type="file" id="myFile" accept=".json,application/json" hidden>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- 长按放大卡图 -->
<div id="zoom" class="zoom hidden">
  <img id="zoomImg" alt="">
  <div id="zoomInfo" class="zoom-info"></div>
</div>

<!-- 悬停效果提示 -->
<div id="tip" class="tip hidden"></div>

<script src="lib/crypto-js.js"></script>
<script src="app.js?v=60"></script>
</body>
</html>
