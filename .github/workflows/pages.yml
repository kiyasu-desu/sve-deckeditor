name: Sync to gh-pages

# 把 main 上的站点文件同步到 gh-pages 分支，Pages 会据此自动发布。
#
# 为什么不用 actions/deploy-pages：
#   那条路需要仓库管理员权限去「创建 Pages 站点」，而 Actions 自带的
#   GITHUB_TOKEN 没有该权限，会报 Resource not accessible by integration。
#   本仓库的 Pages 是以「分支部署」方式启用的（gh-pages 分支），
#   所以这里只需要把文件推到 gh-pages 即可。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # 需要推送到 gh-pages

concurrency:
  group: gh-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          for f in index.html app.js style.css style-mobile.css serve.mjs .nojekyll; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp -r data icons lib _site/
          echo "站点内容："
          du -sh _site
          find _site -type f | sort

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'deploy: 同步 main 的站点文件'
          force_orphan: true
