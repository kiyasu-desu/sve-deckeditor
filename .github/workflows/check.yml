name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Existing regression tests
        run: |
          for test in tests/regression/*.mjs; do node "$test"; done
      - run: node scripts/preflight.mjs
      - run: node scripts/test_subpath.mjs
      - run: node scripts/deckcode.mjs selftest
      - run: node scripts/scan_secrets.mjs
